<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fox Squad Swag</title><link rel="stylesheet" href="site.css?v=eta-heading-20261009"></head><body>
<div class="site-hero"><img id="orderStatusLogo" src="Images/Transparent%20fox%20logo.png" alt="Fox Squad logo"><h1 id="orderStatusTitle">FOX SQUAD SWAG</h1><div id="orderStatusContent" class="order-status-content" aria-live="polite"><p>Loading order status…</p></div></div><main class="site-main"><div class="browse-wrap"><a class="site-button" href="products.html">Browse Catalog</a></div><p id="catalogMessage" role="status">Loading catalog…</p><div id="homeRows"></div><div class="browse-wrap"><a class="site-button" href="products.html">Browse Catalog</a></div></main>
<script src="app.js?v=fix-loading-20261009-2"></script><script src="site.js?v=okc-swag-box-20261009"></script><script>
(function(){
  function showError(message){
    var status=document.getElementById("orderStatusContent");
    var catalog=document.getElementById("catalogMessage");
    if(status && /Loading/i.test(status.textContent))status.textContent="Order status temporarily unavailable.";
    if(catalog && /Loading/i.test(catalog.textContent))catalog.textContent="Catalog temporarily unavailable. Try refreshing.";
    console.error("Fox Squad homepage:",message);
  }
  window.addEventListener("error",function(e){showError(e.message);});
  window.addEventListener("unhandledrejection",function(e){showError(e.reason);});
  try{
    if(typeof renderHomepage==="function"){renderHomepage();}
    else{showError("Homepage script failed to load");}
  }catch(e){showError(e.message);}
  setTimeout(function(){var status=document.getElementById("orderStatusContent"),catalog=document.getElementById("catalogMessage");if((status&&/Loading order status/i.test(status.textContent))||(catalog&&/Loading catalog/i.test(catalog.textContent)))showError("Homepage load timed out");},12000);
})();
</script>
</body></html>
