<!DOCTYPE html>
<html>
<head>
<title>Fox Squad Swag - Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial,sans-serif;margin:0;background:#111;color:white;}
.nav{display:flex;justify-content:space-between;padding:14px 18px;background:#0b0b0b;border-bottom:2px solid #ff6600;}
.nav a{color:white;text-decoration:none;font-weight:bold;}
.container{padding:20px;}
.product-content{max-width:700px; margin:0 auto; }
.product-card{background:#222;border-radius:12px;padding:18px;}
.product-card img{width:100%;height:220px;object-fit:cover;background:#333;border-radius:8px;}
.button{display:inline-block;background:#ff6600;color:white;text-decoration:none;border:none;padding:14px 20px;border-radius:8px;font-weight:bold;margin-top:18px;cursor:pointer;}
.description{white-space:pre-wrap;color:#ddd;line-height:1.5;}
.size-list{background:#111;border-radius:10px;padding:15px;margin-top:15px;}
label{font-weight:bold;}
select,input,textarea{width:100%;padding:12px;border-radius:8px;border:none;font-size:16px;}
.option-row{display:grid;grid-template-columns:minmax(120px,42%) 1fr;align-items:center;gap:14px;margin-top:15px;}
.option-row label{margin:0;}
.option-row select,.option-row input,.option-row textarea{margin:0;min-width:0;}
.option-note{grid-column:2;margin:6px 0 0;color:#bbb;font-size:14px;}
.option-group-heading{margin:24px 0 10px;padding:12px 4px 9px;border-top:2px solid #ff6600;color:#fff;font-size:17px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;}
@media(max-width:480px){.option-row{grid-template-columns:minmax(105px,38%) 1fr;gap:10px;}.option-row label{font-size:14px;}}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.7);}
.modal-content{background:#222;margin:8% auto;padding:20px;border-radius:12px;width:90%;max-width:500px;}
.close{float:right;font-size:28px;cursor:pointer;}
.cart-count{font-size:14px;vertical-align:top;margin-left:2px;}
#toast{visibility:hidden;min-width:190px;background:#222;color:white;text-align:center;border:1px solid #ff6600;border-radius:10px;padding:12px 18px;position:fixed;z-index:999;left:50%;bottom:30px;transform:translateX(-50%);font-weight:bold;}
#toast.show{visibility:visible;}

*{box-sizing:border-box;}
.product-title{font-size:clamp(24px,5vw,36px);margin:8px 0 20px;}
.main-product-image{width:100%;height:clamp(260px,65vw,520px);object-fit:contain;background:#181818;border-radius:12px;display:block;}
.purchase-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0;}
.purchase-row .button{margin:0;}
.purchase-row h2{margin:0;font-size:clamp(22px,5vw,30px);}
.description{white-space:normal;overflow-wrap:anywhere;}
.description p{margin:0 0 12px;}
.description ul{padding-left:24px;margin:0 0 16px;}
.description li{margin:6px 0;}
.photo-thumb{flex:0 0 calc((100% - 36px)/4);min-width:0;border:3px solid transparent;border-radius:8px;background:#222;padding:2px;cursor:pointer;scroll-snap-align:start;}
.photo-thumb[aria-pressed="true"]{border-color:#ff6600;}
.photo-thumb img{display:block;width:100%;height:90px;object-fit:contain;border-radius:4px;}
@media(max-width:420px){.photo-thumb img{height:65px;}.container{padding:14px;}}
</style>
<meta charset="UTF-8">
<link rel="stylesheet" href="site.css">
</head>

<body>



<div class="container" id="productContainer"></div>

<script src="app.js?v=option-groups-20261008"></script>
<script src="site.js"></script>

<script>

let currentProduct;

async function loadProduct(){

    const productId =
        new URLSearchParams(window.location.search)
        .get("id");

    const products =
        await loadProducts();

    const product =
        products.find(p =>
            makeProductId(p.name) === productId
        );

    if(!product){

        document.getElementById("productContainer")
            .innerHTML =
            "<h2>Product Not Found</h2>";

        return;
    }

    await loadProductTabs(product);
    currentProduct = product;

    renderProduct(product);
}

function renderProduct(product){

    const image =
        productImage(product);

  document.getElementById("productContainer").innerHTML = `

    <div class="product-content">

        <h1 class="product-title">${escapeHTML(product.name)}</h1>
        <img id="mainProductImage" class="main-product-image" src="${escapeHTML(image)}" alt="${escapeHTML(product.name)}" onerror="this.onerror=null;this.src=NO_IMAGE">
        <div id="productGallery"></div>
        <div class="purchase-row">
            <h2>${product.pricePending ? "Price pending" : "$" + Number(product.price).toFixed(2)}</h2>
            <button class="button" onclick="openOrderModal()">Add to Cart</button>
        </div>

        <div id="orderModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
            <div class="modal-content" style="max-height:80vh;overflow-y:auto;box-sizing:border-box;">
                <button type="button" class="close" onclick="closeOrderModal()" aria-label="Close" style="background:none;border:none;color:white;">×</button>
                <h2 id="orderModalTitle">Choose Your Options</h2>
                <form id="orderForm">
                    <div id="productOptions"></div>
                    <button type="submit" class="button">Add to Cart</button>
                </form>
            </div>
        </div>

        ${product.packSummary ? `<section><h2>Pack Details</h2><div class="description">${formatDescription(product.packSummary)}</div></section>` : ""}
        ${product.includedItems?.length ? `<section><h2>Included Items</h2><ul>${product.includedItems.map(item => `<li>${formatBold(item.trim())}</li>`).join("")}</ul></section>` : ""}
        ${product.description ? `<section aria-label="Description"><h2>Description</h2>
            <div class="description">${formatDescription(product.description)}</div></section>` : ""}
        ${product.features?.length ? `<section aria-label="Features Include"><h2>Features Include</h2>
            <div class="description"><ul>${product.features.map(feature => `<li>${formatBold(feature)}</li>`).join("")}</ul></div></section>` : ""}

        ${product.url ? `<p style="margin-top:28px;">Anthrax: <a href="${escapeHTML(product.url)}" target="_blank" rel="noopener noreferrer" style="color:#ff6600;">${escapeHTML(product.name)} Link</a></p>` : ""}

    </div>
`;

    buildGallery(product);
    buildOptions(product);
    loadEditItem(product);
    document.getElementById("orderForm").addEventListener("submit", event => {
        event.preventDefault();
        addConfiguredProduct();
    });
}

function formatBold(text){
    return escapeHTML(text).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}
function formatDescription(text){
    const bold = formatBold;
    let html="", inList=false;
    for(const line of text.split(/\r?\n/)){
        const bullet=line.match(/^\s*(?:[-*•])\s+(.+)$/);
        if(bullet){if(!inList){html+="<ul>";inList=true;}html+="<li>"+bold(bullet[1])+"</li>";}
        else{if(inList){html+="</ul>";inList=false;}if(line.trim())html+="<p>"+bold(line)+"</p>";}
    }
    return html+(inList ? "</ul>" : "");
}
function buildGallery(product) {
    const gallery=document.getElementById("productGallery");gallery.replaceChildren();
    gallery.style.cssText="display:flex;align-items:center;gap:8px;margin-top:14px;min-width:0";
    const urls=[...new Set([productImage(product),...product.photos.map(p=>productImage({coverImage:p.image}))])].filter(url=>url!==NO_IMAGE);
    if(!urls.length)urls.push(NO_IMAGE);
    const main=document.getElementById("mainProductImage");
    main.src=urls[0];
    const strip=document.createElement("div");strip.style.cssText="display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;flex:1;min-width:0;padding:4px 0";
    strip.setAttribute("aria-label","Product photo thumbnails");
    let selectedIndex=0;
    function selectPhoto(index){
        selectedIndex=(index+urls.length)%urls.length;
        main.onerror=()=>{main.onerror=null;main.src=NO_IMAGE;};
        main.src=urls[selectedIndex];main.alt=product.name+" — photo "+(selectedIndex+1);
        const buttons=[...strip.querySelectorAll("button")];
        buttons.forEach((button,i)=>button.setAttribute("aria-pressed",String(i===selectedIndex)));
        buttons[selectedIndex]?.scrollIntoView({block:"nearest",inline:"nearest",behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    }
    function arrow(direction){
        const button=document.createElement("button");button.type="button";button.textContent=direction<0?"‹":"›";
        button.setAttribute("aria-label",direction<0?"Previous photo":"Next photo");
        button.style.cssText="flex:0 0 28px;background:none;border:0;color:#ff6600;font-size:32px;cursor:pointer";
        button.onclick=()=>selectPhoto(selectedIndex+direction);return button;
    }
    if(urls.length>1)gallery.append(arrow(-1));gallery.append(strip);
    urls.forEach((url,i)=>{
        const button=document.createElement("button");button.type="button";button.className="photo-thumb";
        button.setAttribute("aria-label","View photo "+(i+1));button.setAttribute("aria-pressed",String(i===0));
        const img=document.createElement("img");img.src=url;img.alt="";img.onerror=()=>{img.onerror=null;img.src=NO_IMAGE;};
        button.onclick=()=>selectPhoto(i);
        button.append(img);strip.append(button);
    });
    if(urls.length>1)gallery.append(arrow(1));
}
function buildOptions(product){
    const container=document.getElementById("productOptions");
    container.replaceChildren();
    for(const field of product.orderFields){
        if(field.groupHeading){
            const heading=document.createElement("h3");
            heading.className="option-group-heading";
            heading.textContent=field.label;
            container.append(heading);
            continue;
        }
        const label=document.createElement("label");label.htmlFor=field.id;
        label.textContent=field.label.replace(/\s*\(optional\)\s*/gi, "").trim() + (field.required ? " *" : " (Optional)");
        let control;
        if(field.type === "dropdown" || field.type === "dependent dropdown" || field.type === "double dependent dropdown"){
            control=document.createElement("select");
            const dependent = field.type !== "dropdown"; const choices = dependent ? [] : field.choices;
            control.add(new Option(dependent ? "Select preceding choices first" : (choices.length ? "Select " + field.label : "Choices not yet available"), ""));
            choices.forEach(choice=>control.add(new Option(choice,choice)));
        }else if(field.type === "text" || field.type === "long text"){
            control=document.createElement(field.type === "long text" ? "textarea" : "input");
            control.style.cssText="width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:8px;font-size:16px";
        }else{throw new Error("Unsupported option type: " + field.type);}
        control.id=field.id;control.required=field.required;
        const row=document.createElement("div");row.className="option-row";
        row.append(label,control);
        container.append(row);
        if(field.type === "dropdown" && !field.choices.length){
            const note=document.createElement("p");note.className="option-note";note.textContent="The organizer still needs to enter choices for " + field.label + ".";
            row.append(note);
        }
    }
    for(const field of product.orderFields.filter(f => f.type.includes("dependent dropdown"))){
        const child=document.getElementById(field.id);
        const parents=(field.parentIds || []).map(id => id && document.getElementById(id));
        if(!parents.length || parents.some(p => !p)){child.disabled=true;continue;}
        const refresh=()=>{
            const old=child.value;
            const ready=parents.every(p => p.value);
            const key=parents.map(p => p.value.trim().replace(/\s+/g," ").toLowerCase()).join("+");
            const choices=ready ? (field.choiceMap[key] || []) : [];
            child.replaceChildren(new Option(!ready ? "Select preceding choices first" : (choices.length ? "Select " + field.label : "No sizes for this combination"),""));
            choices.forEach(choice=>child.add(new Option(choice,choice)));
            if(choices.includes(old))child.value=old;
            child.disabled=!ready || !choices.length;
            if(old!==child.value)child.dispatchEvent(new Event("change"));
        };
        parents.forEach(p=>p.addEventListener("change",refresh));
        refresh();
    }
    const label=document.createElement("label");label.htmlFor="orderQuantity";label.textContent="Quantity";
    const qty=document.createElement("input");qty.id="orderQuantity";qty.type="number";qty.min="1";qty.step="1";qty.value="1";qty.required=true;
    const qtyRow=document.createElement("div");qtyRow.className="option-row";qtyRow.append(label,qty);container.append(qtyRow);
}

let previousFocus;
function openOrderModal(){
    if(currentProduct.pricePending) {
        alert("Pricing is pending. Please contact the team organizer before adding this item.");
        return;
    }
    previousFocus = document.activeElement;
    document.getElementById("orderModal").style.display = "block";
    document.body.style.overflow = "hidden";
    document.querySelector("#orderForm select, #orderForm input, #orderForm textarea, #orderForm button").focus();
}
function closeOrderModal(){
    document.getElementById("orderModal").style.display = "none";
    document.body.style.overflow = "";
    previousFocus?.focus();
}
document.addEventListener("keydown", event => {
    const modal = document.getElementById("orderModal");
    if(!modal || modal.style.display !== "block") return;
    if(event.key === "Escape") closeOrderModal();
    if(event.key === "Tab") {
        const controls = [...modal.querySelectorAll("button,select,input,textarea")];
        const first = controls[0], last = controls[controls.length - 1];
        if(event.shiftKey && document.activeElement === first){ event.preventDefault(); last.focus(); }
        else if(!event.shiftKey && document.activeElement === last){ event.preventDefault(); first.focus(); }
    }
});
document.addEventListener("click", event => {
    if(event.target.id === "orderModal") closeOrderModal();
});
function loadEditItem(product){
    const params = new URLSearchParams(window.location.search);
    const editIndex = params.get("edit");
    if(editIndex === null) return;

    let editData;
    try {
        editData = JSON.parse(sessionStorage.getItem("foxSquadEditItem"));
    } catch(error) {
        return;
    }

    if(!editData || Number(editData.index) !== Number(editIndex) || editData.item?.name !== product.name) return;

    for(const field of product.orderFields){
        const control = document.getElementById(field.id);
        if(control){
            control.value = editData.item.selections?.[field.label] || "";
            control.dispatchEvent(new Event("change"));
        }
    }

    document.getElementById("orderQuantity").value = editData.item.quantity || 1;
    document.getElementById("orderModalTitle").textContent = "Edit Item";
    document.querySelector("#orderForm button[type='submit']").textContent = "Save Changes";
    openOrderModal();
}

function addConfiguredProduct(){
    const form=document.getElementById("orderForm");
    if(!form.reportValidity()) return;

    const selections=Object.fromEntries(currentProduct.orderFields.filter(field=>!field.groupHeading).map(field=>[field.label,document.getElementById(field.id).value]));
    const configuredItem = {
        name: currentProduct.name,
        price: currentProduct.price,
        quantity: Number(document.getElementById("orderQuantity").value),
        selections: selections
    };

    const editIndex = new URLSearchParams(window.location.search).get("edit");

    if(editIndex !== null){
        const cart = getCart();
        const index = Number(editIndex);

        if(Number.isInteger(index) && cart[index]){
            cart[index] = configuredItem;
            saveCart(cart);
            sessionStorage.removeItem("foxSquadEditItem");
            window.location.href = "cart.html";
            return;
        }
    }

    addToCart(configuredItem);
    closeOrderModal();
}

loadProduct().catch(() => { document.getElementById("productContainer").textContent = "Product information unavailable. Please try again later."; });

</script>

</body>
</html>
