<!DOCTYPE html>
<html>
<head>
<title>Fox Squad Swag - Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial,sans-serif;margin:0;background:#111;color:white;}
.nav{display:flex;justify-content:space-between;padding:14px 18px;background:#0b0b0b;border-bottom:2px solid #ff6600;}
.nav a{color:white;text-decoration:none;font-weight:bold;}
.container{padding:20px;}
.product-content{max-width:700px; margin:0 auto; }
.product-card{background:#222;border-radius:12px;padding:18px;}
.product-card img{width:100%;height:220px;object-fit:cover;background:#333;border-radius:8px;}
.button{display:inline-block;background:#ff6600;color:white;text-decoration:none;border:none;padding:14px 20px;border-radius:8px;font-weight:bold;margin-top:18px;cursor:pointer;}
.description{white-space:pre-wrap;color:#ddd;line-height:1.5;}
.size-list{background:#111;border-radius:10px;padding:15px;margin-top:15px;}
label{display:block;margin-top:15px;font-weight:bold;}
select,input{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:none;font-size:16px;}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.7);}
.modal-content{background:#222;margin:8% auto;padding:20px;border-radius:12px;width:90%;max-width:500px;}
.close{float:right;font-size:28px;cursor:pointer;}
.cart-count{font-size:14px;vertical-align:top;margin-left:2px;}
#toast{visibility:hidden;min-width:190px;background:#222;color:white;text-align:center;border:1px solid #ff6600;border-radius:10px;padding:12px 18px;position:fixed;z-index:999;left:50%;bottom:30px;transform:translateX(-50%);font-weight:bold;}
#toast.show{visibility:visible;}
</style>
</head>

<body>

<div class="nav">
    <a href="products.html">← Catalog</a>
    <a href="cart.html">🛒<span id="cartCount" class="cart-count"></span></a>
</div>

<div class="container" id="productContainer"></div>

</div>

<script src="app.js"></script>

<script>

let currentProduct;

async function loadProduct(){

    const productId =
        new URLSearchParams(window.location.search)
        .get("id");

    const products =
        await loadProducts();

    const product =
        products.find(p =>
            makeProductId(p.name) === productId
        );

    if(!product){

        document.getElementById("productContainer")
            .innerHTML =
            "<h2>Product Not Found</h2>";

        return;
    }

    currentProduct = product;

    renderProduct(product);
}

function renderProduct(product){

    const image =
        productImage(product);

  document.getElementById("productContainer").innerHTML = `

    <div class="product-content">

        <img
            src="${escapeHTML(image)}" alt="${escapeHTML(product.name)}" onerror="this.onerror=null;this.src=NO_IMAGE"
            style="
                width:100%;
                max-width:700px;
                border-radius:12px;
                display:block;
                margin:auto;
            "
        >

        <h1>${escapeHTML(product.name)}</h1>

        <h2>${product.pricePending ? "Price pending" : "$" + Number(product.price).toFixed(2)}</h2>

        <div id="orderModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
            <div class="modal-content" style="max-height:80vh;overflow-y:auto;box-sizing:border-box;">
                <button type="button" class="close" onclick="closeOrderModal()" aria-label="Close" style="background:none;border:none;color:white;">×</button>
                <h2 id="orderModalTitle">Choose Your Options</h2>
                <form id="orderForm">
                    <div id="productOptions"></div>
                    <button type="submit" class="button">Add to Cart</button>
                </form>
            </div>
        </div>

        <button
            class="button"
            onclick="openOrderModal()">
            Add To Cart
        </button>

        <h2>Description</h2>

        <p class="description">
            ${escapeHTML(product.description || "")}
        </p>

    </div>
`;

    buildOptions(product);
    document.getElementById("orderForm").addEventListener("submit", event => {
        event.preventDefault();
        addConfiguredProduct();
    });
}

function buildOptions(product){

    let html = "";

    if(product.sizeGroups){

        html += `
            <label for="sizeGroup">Size Group</label>
            <select id="sizeGroup" required></select>

            <label for="size">Size</label>
            <select id="size" required></select>
        `;
    }

    document.getElementById("productOptions")
        .innerHTML = html;

    if(product.sizeGroups){
        setupSizes(product);
    }
}

function setupSizes(product){

    const groupSelect =
        document.getElementById("sizeGroup");

    const sizeSelect =
        document.getElementById("size");

    product.sizeGroups.forEach(group => {

        groupSelect.innerHTML += `
            <option value="${group}">
                ${group}
            </option>
        `;
    });

    function loadSizes(){

        const group =
            groupSelect.value.toLowerCase();

        const sizes =
            product.sizes[group] || [];

        sizeSelect.innerHTML = "";

        sizes.forEach(size => {

            sizeSelect.innerHTML += `
                <option value="${size}">
                    ${size}
                </option>
            `;
        });
    }

    groupSelect.addEventListener(
        "change",
        loadSizes
    );

    loadSizes();
}

let previousFocus;
function openOrderModal(){
    if(currentProduct.pricePending) {
        alert("Pricing is pending. Please contact the team organizer before adding this item.");
        return;
    }
    previousFocus = document.activeElement;
    document.getElementById("orderModal").style.display = "block";
    document.body.style.overflow = "hidden";
    document.querySelector("#orderForm select, #orderForm button").focus();
}
function closeOrderModal(){
    document.getElementById("orderModal").style.display = "none";
    document.body.style.overflow = "";
    previousFocus?.focus();
}
document.addEventListener("keydown", event => {
    const modal = document.getElementById("orderModal");
    if(!modal || modal.style.display !== "block") return;
    if(event.key === "Escape") closeOrderModal();
    if(event.key === "Tab") {
        const controls = [...modal.querySelectorAll("button,select,input")];
        const first = controls[0], last = controls[controls.length - 1];
        if(event.shiftKey && document.activeElement === first){ event.preventDefault(); last.focus(); }
        else if(!event.shiftKey && document.activeElement === last){ event.preventDefault(); first.focus(); }
    }
});
document.addEventListener("click", event => {
    if(event.target.id === "orderModal") closeOrderModal();
});
function addConfiguredProduct(){
    addToCart({
        name: currentProduct.name,
        price: currentProduct.price,
        quantity: 1,
        sizeGroup: document.getElementById("sizeGroup")?.value || "",
        size: document.getElementById("size")?.value || ""
    });
    closeOrderModal();
}

loadProduct().catch(() => { document.getElementById("productContainer").textContent = "Product information unavailable. Please try again later."; });

</script>

</body>
</html>
